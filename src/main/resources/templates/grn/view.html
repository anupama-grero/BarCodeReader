<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GRN Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h2>GRN Details</h2>
<div class="card p-3 mb-3">
    <p><strong>GRN Number:</strong> <span th:text="${goodsReceivedNote.grnNumber}"></span></p>
    <p><strong>Purchase Order:</strong> <span th:text="${goodsReceivedNote.purchaseOrder.poNumber}"></span></p>
    <p><strong>Supplier:</strong> <span th:text="${goodsReceivedNote.purchaseOrder.supplier != null ? goodsReceivedNote.purchaseOrder.supplier.companyName ?: goodsReceivedNote.purchaseOrder.supplier.name : 'N/A'}"></span></p>
    <p><strong>Received Date:</strong> <span th:text="${goodsReceivedNote.receivedDate}"></span></p>
    <p><strong>Status:</strong> <span class="badge bg-success" th:text="${goodsReceivedNote.status}"></span></p>
    <p><strong>Total Amount:</strong> <span th:text="${goodsReceivedNote.totalAmount}"></span></p>
    <p><strong>Remarks:</strong> <span th:text="${goodsReceivedNote.remarks}"></span></p>
</div>
<h4>Items</h4>
<table class="table table-bordered">
    <thead>
    <tr>
        <th>Product</th>
        <th>Ordered Qty</th>
        <th>Received Qty</th>
        <th>Unit Price</th>
        <th>Line Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${goodsReceivedNote.items}">
        <td th:text="${item.product.name}"></td>
        <td th:text="${item.orderedQuantity}"></td>
        <td th:text="${item.receivedQuantity}"></td>
        <td th:text="${item.unitPrice}"></td>
        <td th:text="${item.lineTotal}"></td>
    </tr>
    </tbody>
</table>
<a class="btn btn-secondary" th:href="@{/grn}">Back to List</a>
</body>
</html>
