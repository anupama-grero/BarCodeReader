<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Goods Received Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h2>Goods Received Note</h2>
<form th:action="${goodsReceivedNote.id != null} ? @{/grn/{id}/update(id=${goodsReceivedNote.id})} : @{/grn}"
      method="post" th:object="${goodsReceivedNote}">
    <div class="mb-3">
        <label class="form-label">Purchase Order</label>
        <select class="form-select" th:field="*{purchaseOrder}">
            <option value="">-- Select Purchase Order --</option>
            <option th:each="po : ${purchaseOrders}"
                    th:value="${po.id}"
                    th:text="${po.poNumber + ' - ' + po.supplier.companyName}"></option>
        </select>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Received Date</label>
            <input type="date" class="form-control" th:field="*{receivedDate}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option th:each="status : ${T(com.bci.productcrud.model.GoodsReceivedNoteStatus).values()}"
                        th:value="${status}" th:text="${status}"></option>
            </select>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Remarks</label>
        <textarea class="form-control" th:field="*{remarks}"></textarea>
    </div>
    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Save GRN</button>
        <a class="btn btn-secondary" th:href="@{/grn}">Cancel</a>
    </div>
</form>
</body>
</html>
