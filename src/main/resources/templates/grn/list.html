<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Goods Received Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h2>Goods Received Notes</h2>
<a class="btn btn-primary mb-3" th:href="@{/grn/new}">Add GRN</a>
<a class="btn btn-outline-secondary mb-3" th:href="@{/}">Back to Home</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th>GRN Number</th>
        <th>PO Number</th>
        <th>Received Date</th>
        <th>Supplier</th>
        <th>Status</th>
        <th>Total</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="grn : ${grns}">
        <td th:text="${grn.grnNumber}"></td>
        <td th:text="${grn.purchaseOrder.poNumber}"></td>
        <td th:text="${grn.receivedDate}"></td>
        <td th:text="${grn.purchaseOrder.supplier != null ? grn.purchaseOrder.supplier.companyName ?: grn.purchaseOrder.supplier.name : 'N/A'}"></td>
        <td th:text="${grn.status}"></td>
        <td th:text="${grn.totalAmount}"></td>
        <td>
            <a class="btn btn-sm btn-info" th:href="@{/grn/{id}(id=${grn.id})}">View</a>
            <a class="btn btn-sm btn-warning" th:href="@{/grn/{id}/edit(id=${grn.id})}">Edit</a>
            <form th:action="@{/grn/{id}/delete(id=${grn.id})}" method="post" style="display:inline;">
                <button class="btn btn-sm btn-danger" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
