<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Purchase Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h2>Purchase Orders</h2>
<a class="btn btn-primary mb-3" th:href="@{/purchase-orders/new}">Add Purchase Order</a>
<a class="btn btn-outline-secondary mb-3" th:href="@{/}">Back to Home</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th>PO Number</th>
        <th>Supplier</th>
        <th>Order Date</th>
        <th>Total</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="po : ${purchaseOrders}">
        <td th:text="${po.poNumber}"></td>
        <td th:text="${po.supplier != null ? po.supplier.companyName ?: po.supplier.name : 'N/A'}"></td>
        <td th:text="${po.orderDate}"></td>
        <td th:text="${po.totalAmount}"></td>
        <td>
            <span class="badge bg-info" th:text="${po.status}"></span>
        </td>
        <td>
            <a class="btn btn-sm btn-info" th:href="@{/purchase-orders/{id}(id=${po.id})}">View</a>
            <a class="btn btn-sm btn-warning" th:href="@{/purchase-orders/{id}/edit(id=${po.id})}">Edit</a>
            <form th:action="@{/purchase-orders/{id}/delete(id=${po.id})}" method="post" style="display:inline;">
                <button class="btn btn-sm btn-danger" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
