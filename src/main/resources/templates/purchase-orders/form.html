<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Purchase Order Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h2>Purchase Order</h2>
<form th:action="${purchaseOrder.id != null} ? @{/purchase-orders/{id}/update(id=${purchaseOrder.id})} : @{/purchase-orders}"
      method="post" th:object="${purchaseOrder}">
    <div class="mb-3">
        <label class="form-label">Supplier</label>
        <select class="form-select" th:field="*{supplier}">
            <option value="">-- Select Supplier --</option>
            <option th:each="supplier : ${suppliers}"
                    th:value="${supplier.id}"
                    th:text="${supplier.companyName != null ? supplier.companyName : supplier.name}"></option>
        </select>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Order Date</label>
            <input type="date" class="form-control" th:field="*{orderDate}">
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Expected Delivery Date</label>
            <input type="date" class="form-control" th:field="*{expectedDeliveryDate}">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select" th:field="*{status}">
            <option th:each="status : ${T(com.bci.productcrud.model.PurchaseOrderStatus).values()}"
                    th:value="${status}" th:text="${status}"></option>
        </select>
    </div>

    <div class="mb-3">
        <button type="submit" class="btn btn-primary">Save Purchase Order</button>
        <a class="btn btn-secondary" th:href="@{/purchase-orders}">Cancel</a>
    </div>
</form>
</body>
</html>
