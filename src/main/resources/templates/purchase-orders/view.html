<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Purchase Order Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h2>Purchase Order Details</h2>
<div class="card p-3 mb-3">
    <p><strong>PO Number:</strong> <span th:text="${purchaseOrder.poNumber}"></span></p>
    <p><strong>Supplier:</strong> <span th:text="${purchaseOrder.supplier != null ? purchaseOrder.supplier.companyName ?: purchaseOrder.supplier.name : 'N/A'}"></span></p>
    <p><strong>Order Date:</strong> <span th:text="${purchaseOrder.orderDate}"></span></p>
    <p><strong>Expected Delivery Date:</strong> <span th:text="${purchaseOrder.expectedDeliveryDate}"></span></p>
    <p><strong>Status:</strong> <span class="badge bg-info" th:text="${purchaseOrder.status}"></span></p>
    <p><strong>Total Amount:</strong> <span th:text="${purchaseOrder.totalAmount}"></span></p>
</div>
<h4>Items</h4>
<table class="table table-bordered">
    <thead>
    <tr>
        <th>Product</th>
        <th>Quantity</th>
        <th>Unit Price</th>
        <th>Line Total</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${purchaseOrder.items}">
        <td th:text="${item.product.name}"></td>
        <td th:text="${item.quantity}"></td>
        <td th:text="${item.unitPrice}"></td>
        <td th:text="${item.lineTotal}"></td>
    </tr>
    </tbody>
</table>
<a class="btn btn-secondary" th:href="@{/purchase-orders}">Back to List</a>
</body>
</html>
